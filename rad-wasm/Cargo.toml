[package]
name = "rad-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly wrapper around Spark's spark-lib for converting Gaussian splat files to RAD"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Spark's core splat library: decoders, LoD builders and the RAD encoder.
# Pinned to the commit this converter was built and tested against.
spark-lib = { git = "https://github.com/sparkjsdev/spark", rev = "c57ebb936a5d364e021a66a118204d599f6fdaa8", default-features = false, features = [
    "antisplat", "ksplat", "ply", "rad", "sogs", "spz", "csplat", "gsplat", "tiny_lod", "bhatt_lod",
] }
# Must match the wasm-bindgen CLI version used by build.ps1 / build.sh
wasm-bindgen = "=0.2.117"
js-sys = "0.3.94"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1"
half = "2.6"
glam = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
